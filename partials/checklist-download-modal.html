<div class="modal-overlay" id="checklistDownloadModal">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <button class="modal-close" onclick="closeChecklistModal()">&#x2715;</button>
      <span class="modal-icon-3d"><img src="/favicon.png" alt="NEST logo" style="width:100%;height:100%;object-fit:cover;border-radius:14px;display:block"/></span>
      <div class="modal-title">Get the Free Checklist</div>
      <div class="modal-sub-txt">Speech Delay or Autism?</div>
    </div>
    <div class="modal-body">
      <div class="step-panel active" id="checklistFormPanel">
        <div class="step-desc" style="font-size:0.78rem;white-space:nowrap">Enter your details and the PDF will open right away.</div>
        <div class="form-group"><label>Your Name <span class="req">*</span></label><input type="text" id="checklistName" placeholder="e.g. Sara Khan" autocomplete="name" maxlength="40"/><div class="err-msg" id="checklistNameErr">Please enter your name</div></div>
        <div class="form-group"><label>Phone Number <span class="req">*</span></label><input type="tel" id="checklistPhone" placeholder="e.g. 0300-1234567" autocomplete="tel" maxlength="11" inputmode="numeric"/><div class="err-msg" id="checklistPhoneErr">Enter valid Pakistani number e.g. 0300-1234567</div></div>
      </div>
    </div>
    <div class="modal-footer" id="checklistModalFooter">
      <button class="btn-fsubmit" id="checklistSubmitBtn" onclick="submitChecklistForm()">Download Checklist <span class="btn-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="white" stroke="none"/></svg></span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="guideDownloadModal">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <button class="modal-close" onclick="closeGuideModal()">&#x2715;</button>
      <span class="modal-icon-3d"><img src="/favicon.png" alt="NEST logo" style="width:100%;height:100%;object-fit:cover;border-radius:14px;display:block"/></span>
      <div class="modal-title">Get the Free Guide</div>
      <div class="modal-sub-txt">Signs to Look For Before Age 3</div>
    </div>
    <div class="modal-body">
      <div class="step-panel active" id="guideFormPanel">
        <div class="step-desc">Enter your email and your free guide will open as a PDF right away. No spam, ever.</div>
        <div class="form-group"><label>Email Address <span class="req">*</span></label><input type="email" id="guideEmail" placeholder="e.g. sara@email.com" autocomplete="email"/><div class="err-msg" id="guideEmailErr">Please enter a valid email address</div></div>
      </div>
    </div>
    <div class="modal-footer" id="guideModalFooter">
      <span class="step-counter"></span>
      <button class="btn-fsubmit" id="guideSubmitBtn" onclick="submitGuideForm()">Download Guide <span class="btn-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="white" stroke="none"/></svg></span></button>
    </div>
  </div>
</div>
